name: cache

services:
  sync:
    command: python3 manage.py runserver 0.0.0.0:8000 --noreload
    environment:
      DEV: TRUE
      DEBUG: FALSE
      TEST: FALSE
      ENVIRONMENT: test
    ports: !override []
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 2s
      retries: 30
      start_period: 30s

  test:
    tty: true
    build:
      context: ../
      dockerfile: apps/tests/Dockerfile
      args:
        USER_ID: ${USER_ID}
    env_file:
      - path: ${UNIVERSAL_CONFIG_DIR}/.env
        required: true
      - path: ${UNIVERSAL_CONFIG_DIR}/.env.dev
        required: true
      - path: ${UNIVERSAL_CONFIG_DIR}/cache/.env
        required: true
      - path: ${UNIVERSAL_CONFIG_DIR}/cache/.env.dev
        required: true
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PORT: 5432
      DEV: TRUE
      DEBUG: FALSE
      TEST: TRUE
      ENVIRONMENT: test
    secrets:
      - admin
    networks:
      - default
    volumes:
      - ./../apps/sync:/home/wywy
      - ${UNIVERSAL_CONFIG_DIR}/config.yml:/home/wywy/config.yml
    depends_on:
      sync:
        condition: service_healthy
      create_tables:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    # command: sleep 3600

  # @TODO secrets for db authentication
  database:
    restart: no
    environment:
      PGDATA: /tmp/postgres
    healthcheck:
      interval: 1s
      start_period: 30s
      retries: 30

# @TODO determine if SQL receptionist network needs to be added
networks:
  default: {}
